name: CI Tests

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov requests jq

      - name: Supabase connectivity smoke test (anon key)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Running Supabase connectivity test..."
            python scripts/supabase_db_test.py
          else
            echo "Skipping Supabase test - credentials not configured"
          fi

      - name: Supabase service-role write check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_TABLE: chat_sessions
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Running Supabase service-role test..."
            python - <<'PY'
          import os
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_KEY"]
          table = os.environ.get("SUPABASE_TABLE", "chat_sessions")
          client = create_client(url, key)
          row = {
              "module_type": "ci_smoke",
              "status": "ongoing",
              "channel": "ci_workflow",
          }
          resp = client.table(table).insert(row).execute()
          assert resp.data, "Service-role insert returned empty data"
          PY
          else
            echo "Skipping service-role test - credentials not configured"
          fi

      - name: Run pytest (skip LLM tests if no API key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running backend tests..."
          pytest -v --maxfail=3 --disable-warnings
