name: Deploy

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run pytest
        working-directory: backend
        run: pytest -q

  build_image:
    name: Build & push Docker image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/search_goods:latest
            ghcr.io/${{ github.repository_owner }}/search_goods:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Render deployment
    needs: [tests, build_image]
    runs-on: ubuntu-latest
    env:
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Render secrets
        run: |
          if [ -z "${RENDER_SERVICE_ID}" ] || [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::Missing RENDER_SERVICE_ID or RENDER_API_KEY, skip deploy."
            exit 1
          fi
          echo "RENDER_SERVICE_ID length: ${#RENDER_SERVICE_ID}"
          echo "RENDER_API_KEY length: ${#RENDER_API_KEY}"

      - name: Trigger Render deployment
        if: ${{ env.RENDER_SERVICE_ID && env.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS -D /tmp/render_headers.txt --fail-with-body \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys
          echo "Render response headers:"
          cat /tmp/render_headers.txt
