name: 🧪 E2E 自動化測試

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout 代碼
        uses: actions/checkout@v4
      
      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 🟢 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 安裝 Python 依賴
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: 📦 安裝 Node 依賴
        run: |
          npm install
          npx playwright install --with-deps chromium
      
      - name: 🚀 啟動後端服務
        run: |
          cd backend
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          echo $! > ../backend.pid
          sleep 5
          
          # 檢查後端是否啟動成功
          curl -f http://localhost:8000/health || (echo "❌ 後端啟動失敗"; exit 1)
          echo "✅ 後端服務已啟動"
      
      - name: 🚀 啟動前端服務
        run: |
          cd frontend
          python -m http.server 5173 &
          echo $! > ../frontend.pid
          sleep 3
          
          # 檢查前端是否啟動成功
          curl -f http://localhost:5173 || (echo "❌ 前端啟動失敗"; exit 1)
          echo "✅ 前端服務已啟動"
      
      - name: 🧪 執行 E2E 測試
        run: npm run test:e2e
      
      - name: 📊 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: 📸 上傳測試截圖
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
      
      - name: 🧹 清理服務
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) 2>/dev/null || true
          fi
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) 2>/dev/null || true
          fi
          echo "✅ 服務已停止"
