version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: search_goods:latest
    restart: unless-stopped
    environment:
      - DATA_PATH=/app/data/VIEW_GOODS_enhanced.csv
      - PYTHONUNBUFFERED=1
      - USE_LLM_EXPAND=False
      - USE_LLM_SHORTDESC=False
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
